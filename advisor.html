<!DOCTYPE html>
<html lang="af">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Advisor - QAIL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        header p {
            color: #a0a0a0;
            font-size: 1.1em;
        }
        
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .platform-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .platform-btn {
            flex: 1;
            min-width: 120px;
            padding: 15px 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: transparent;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .platform-btn:hover {
            border-color: #00d4ff;
            background: rgba(0,212,255,0.1);
        }
        
        .platform-btn.active {
            border-color: #00d4ff;
            background: rgba(0,212,255,0.2);
        }
        
        .platform-btn img {
            width: 30px;
            height: 30px;
            margin-bottom: 8px;
        }
        
        .urls-section {
            margin-top: 20px;
        }
        
        .url-input-group {
            margin-bottom: 20px;
        }
        
        .url-input-group label {
            display: block;
            margin-bottom: 8px;
            color: #a0a0a0;
            font-size: 0.9em;
        }
        
        .url-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .url-input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        
        .url-input::placeholder {
            color: #666;
        }
        
        .compare-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .compare-btn:hover {
            transform: scale(1.02);
        }
        
        .compare-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status-text {
            color: #a0a0a0;
            margin-bottom: 20px;
        }
        
        .results {
            display: none;
        }
        
        .results.show {
            display: block;
        }
        
        .property-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border: 2px solid rgba(255,255,255,0.1);
        }
        
        .property-card.winner {
            border-color: #00d4ff;
            background: rgba(0,212,255,0.1);
        }
        
        .property-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        
        .property-name {
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .property-price {
            font-size: 1.4em;
            color: #00d4ff;
            font-weight: bold;
        }
        
        .property-rating {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .stars {
            color: #ffd700;
        }
        
        .review-count {
            color: #a0a0a0;
            font-size: 0.9em;
        }
        
        .property-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        
        .detail-item {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 10px;
        }
        
        .detail-label {
            font-size: 0.8em;
            color: #a0a0a0;
            margin-bottom: 4px;
        }
        
        .detail-value {
            font-size: 1em;
            font-weight: bold;
        }
        
        .recommendation {
            background: linear-gradient(135deg, rgba(0,212,255,0.2), rgba(123,44,191,0.2));
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            border: 2px solid #00d4ff;
        }
        
        .recommendation h3 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #00d4ff;
        }
        
        .recommendation p {
            line-height: 1.8;
            color: #e0e0e0;
        }
        
        .winner-badge {
            display: inline-block;
            background: #00d4ff;
            color: #1a1a2e;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .features-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .feature-tag {
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏠 Platform Advisor</h1>
            <p>Vergelyk 3 eiendomme en kry AI-aanbeveling</p>
        </header>
        
        <div class="card">
            <div class="platform-selector">
                <button class="platform-btn active" data-platform="airbnb">
                    <div>🏠 Airbnb</div>
                </button>
                <button class="platform-btn" data-platform="lekkeslaap">
                    <div>🏖️ Lekkeslaap</div>
                </button>
                <button class="platform-btn" data-platform="booking">
                    <div>📅 Booking.com</div>
                </button>
            </div>
            
            <div class="urls-section">
                <div class="url-input-group">
                    <label>Eiendom 1</label>
                    <input type="url" class="url-input" id="url1" placeholder="https://www.airbnb.com/rooms/...">
                </div>
                <div class="url-input-group">
                    <label>Eiendom 2</label>
                    <input type="url" class="url-input" id="url2" placeholder="https://www.airbnb.com/rooms/...">
                </div>
                <div class="url-input-group">
                    <label>Eiendom 3</label>
                    <input type="url" class="url-input" id="url3" placeholder="https://www.airbnb.com/rooms/...">
                </div>
            </div>
            
            <button class="compare-btn" id="compareBtn" onclick="compareProperties()">
                🔍 Vergelyk Nou
            </button>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="status-text" id="statusText">Bladsye word geopen...</div>
        </div>
        
        <div class="results" id="results">
            <div id="propertiesList"></div>
            <div class="recommendation" id="recommendation"></div>
        </div>
    </div>
    
    <script>
        let selectedPlatform = 'airbnb';
        
        // Platform button handlers
        document.querySelectorAll('.platform-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.platform-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedPlatform = btn.dataset.platform;
            });
        });
        
        async function compareProperties() {
            const url1 = document.getElementById('url1').value.trim();
            const url2 = document.getElementById('url2').value.trim();
            const url3 = document.getElementById('url3').value.trim();
            
            if (!url1 || !url2 || !url3) {
                alert('Vul asseblief al 3 URL\'s in');
                return;
            }
            
            const btn = document.getElementById('compareBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            
            btn.disabled = true;
            loading.classList.add('show');
            results.classList.remove('show');
            
            try {
                // Call the backend API
                const response = await fetch('/api/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls: [url1, url2, url3], platform: selectedPlatform })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                displayResults(data.properties, data.recommendation);
                
            } catch (error) {
                alert('Fout: ' + error.message);
            } finally {
                btn.disabled = false;
                loading.classList.remove('show');
            }
        }
        
        function displayResults(properties, recommendation) {
            const propertiesList = document.getElementById('propertiesList');
            const recDiv = document.getElementById('recommendation');
            
            propertiesList.innerHTML = properties.map((prop, idx) => `
                <div class="property-card ${prop.isWinner ? 'winner' : ''}">
                    ${prop.isWinner ? '<div class="winner-badge">⭐ Beste Waarde</div>' : ''}
                    <div class="property-header">
                        <div class="property-name">${prop.name}</div>
                        <div class="property-price">${prop.price}</div>
                    </div>
                    <div class="property-rating">
                        <span class="stars">${'⭐'.repeat(Math.round(prop.rating))}</span>
                        <span>${prop.rating}/5</span>
                        <span class="review-count">(${prop.reviews} reviews)</span>
                    </div>
                    <div class="property-details">
                        <div class="detail-item">
                            <div class="detail-label">Ligging</div>
                            <div class="detail-value">${prop.location}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Gaste</div>
                            <div class="detail-value">${prop.guests}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Slaapkamer</div>
                            <div class="detail-value">${prop.bedrooms}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Badkamer</div>
                            <div class="detail-value">${prop.bathrooms}</div>
                        </div>
                    </div>
                    <div class="features-list">
                        ${prop.amenities.map(a => `<span class="feature-tag">${a}</span>`).join('')}
                    </div>
                </div>
            `).join('');
            
            recDiv.innerHTML = `
                <h3>💡 AI Aanbeveling</h3>
                <p>${recommendation}</p>
            `;
            
            results.classList.add('show');
        }
    </script>
</body>
</html>
